# HTTP-only config — demo (SQLite) and pre-SSL production
server {
    listen 80;
    # add 16.112.61.10 here only if no other nginx vhost claims port 80 default_server
    server_name telemedicine.4by4softwares.com;

    root  /var/www/telemedicine;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
    }

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
